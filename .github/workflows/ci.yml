name: CI & Build Matrix

on:
  push:
    branches: [ master, main, 2.0-alpha ]
  pull_request:
    branches: [ master, main, 2.0-alpha ]

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Check Formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted properly:"
            gofmt -l .
            exit 1
          fi

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v -race ./...

  matrix-build:
    name: Cross-Compile Matrix (${{ matrix.target_name }})
    runs-on: ubuntu-latest
    needs: lint-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Raspberry Pi Zero / Zero W / Legacy ARMv6
          - goos: linux
            goarch: arm
            goarm: 6
            target_name: RPi-Zero-W-ARMv6
            binary: raspiducky-linux-armv6

          # Raspberry Pi 2 / 3 (32-bit) / Orange Pi / Banana Pi (ARMv7)
          - goos: linux
            goarch: arm
            goarm: 7
            target_name: RPi-2-3-ARMv7
            binary: raspiducky-linux-armv7

          # Raspberry Pi 3/4/5 / Zero 2 W / Orange Pi 3/5 / Rockchip (64-bit ARM64)
          - goos: linux
            goarch: arm64
            goarm: ""
            target_name: RPi-4-5-Zero2W-ARM64
            binary: raspiducky-linux-arm64

          # Standard x86_64 Linux / PC / Embedded x86
          - goos: linux
            goarch: amd64
            goarm: ""
            target_name: Linux-x86_64
            binary: raspiducky-linux-amd64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          go build -ldflags="-s -w" -o build/${{ matrix.binary }} ./cmd/raspiducky

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target_name }}
          path: build/${{ matrix.binary }}
          retention-days: 7
